name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear proyecto Android
        run: |
          mkdir -p app/src/main/java/com/clearshares/app app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ClearShares"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.clearshares.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.clearshares.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <package android:name="com.zhiliaoapp.musically" />
                  <package android:name="com.ss.android.ugc.trill" />
              </queries>
              <application
                  android:allowBackup="false"
                  android:label="Clear Shares"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ShareCleanerService"
                      android:exported="true"
                      android:label="Clear Shares"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:packageNames="com.zhiliaoapp.musically,com.ss.android.ugc.trill"
              android:description="@string/service_desc"
              android:notificationTimeout="100" />
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="service_desc">Solo actúa sobre TikTok y solo cuando pulsas Borrar compartidos. No guarda ni envía datos.</string>
          </resources>
          EOF

          cat > app/src/main/java/com/clearshares/app/MainActivity.kt <<'EOF'
          package com.clearshares.app

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (24 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(pad, pad, pad, pad)
                  }
                  root.addView(TextView(this).apply { text = "Clear Shares"; textSize = 28f; gravity = Gravity.CENTER })
                  root.addView(TextView(this).apply {
                      text = "\nAbre TikTok con tu sesión ya iniciada y borra tus compartidos con un toque. No pide tu contraseña.\n"
                      gravity = Gravity.CENTER
                  })
                  root.addView(Button(this).apply {
                      text = "1. Activar accesibilidad"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })
                  root.addView(Button(this).apply {
                      text = "2. Borrar compartidos"
                      setOnClickListener {
                          val s = ShareCleanerService.instance
                          if (s == null) {
                              status.text = "Primero activa Clear Shares en Accesibilidad"
                          } else {
                              s.start()
                          }
                      }
                  })
                  status = TextView(this).apply { gravity = Gravity.CENTER; setPadding(0, pad, 0, 0) }
                  root.addView(status)
                  setContentView(root)
                  ShareCleanerService.listener = { msg -> runOnUiThread { status.text = msg } }
              }

              override fun onResume() {
                  super.onResume()
                  status.text = if (ShareCleanerService.instance != null) "Servicio activo ✅" else "Servicio desactivado"
              }
          }
          EOF

          cat > app/src/main/java/com/clearshares/app/ShareCleanerService.kt <<'EOF'
          package com.clearshares.app

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.graphics.Rect
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class ShareCleanerService : AccessibilityService() {

              companion object {
                  @Volatile var instance: ShareCleanerService? = null
                  @Volatile var running = false
                  @Volatile var listener: ((String) -> Unit)? = null

                  val TIKTOK = listOf("com.zhiliaoapp.musically", "com.ss.android.ugc.trill")

                  // AJUSTA AQUI los textos si tu version o idioma de TikTok es distinto.
                  val PATH = listOf(
                      listOf("Perfil", "Profile"),
                      listOf("Menú", "Menu", "Más opciones", "More options"),
                      listOf("Ajustes y privacidad", "Configuración y privacidad", "Settings and privacy"),
                      listOf("Centro de actividades", "Centro de actividad", "Activity center"),
                      listOf("Compartidos", "Compartido", "Shares", "Shared")
                  )
                  val SELECT = listOf("Seleccionar", "Select")
                  val SELECT_ALL = listOf("Seleccionar todo", "Select all")
                  val DELETE = listOf("Eliminar", "Borrar", "Delete")
              }

              override fun onServiceConnected() { instance = this; post("Servicio activo ✅") }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onDestroy() { instance = null; super.onDestroy() }

              private fun post(msg: String) { listener?.invoke(msg) }

              fun start() {
                  if (running) return
                  running = true
                  Thread {
                      try { flow() } catch (e: Exception) { post("Error: ${e.message}") }
                      running = false
                  }.start()
              }

              private fun flow() {
                  val launch = TIKTOK.firstNotNullOfOrNull { packageManager.getLaunchIntentForPackage(it) }
                  if (launch == null) { post("TikTok no está instalado"); return }
                  post("Abriendo TikTok…")
                  startActivity(launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  Thread.sleep(4000)

                  for ((i, labels) in PATH.withIndex()) {
                      post("Paso ${i + 1}/${PATH.size}: ${labels.first()}")
                      var ok = clickAny(labels, 6)
                      if (!ok && i == 1) ok = tapTopRight()
                      if (!ok) { post("No encontré «${labels.first()}». Ajusta PATH en ShareCleanerService.kt"); return }
                      Thread.sleep(1800)
                  }

                  post("Seleccionando…")
                  if (!clickAny(SELECT, 5)) { post("No hay botón Seleccionar (¿ya está vacío?)"); return }
                  Thread.sleep(1000)
                  clickAny(SELECT_ALL, 5)
                  Thread.sleep(800)
                  if (!clickAny(DELETE, 5)) { post("No encontré Eliminar"); return }
                  Thread.sleep(1000)
                  clickAny(DELETE, 3)
                  post("Listo ✅ Revisa TikTok")
              }

              private fun clickAny(labels: List<String>, retries: Int): Boolean {
                  for (attempt in 0 until retries) {
                      val root = rootInActiveWindow
                      if (root != null && root.packageName?.toString() in TIKTOK) {
                          val node = findNode(root, labels)
                          if (node != null && click(node)) return true
                          if (attempt >= 2) scrollable(root)?.performAction(AccessibilityNodeInfo.ACTION_SCROLL_FORWARD)
                      }
                      Thread.sleep(1000)
                  }
                  return false
              }

              private fun findNode(root: AccessibilityNodeInfo, labels: List<String>): AccessibilityNodeInfo? {
                  for (label in labels) {
                      val hits = root.findAccessibilityNodeInfosByText(label).orEmpty().filter { it.isVisibleToUser }
                      val exact = hits.firstOrNull {
                          (it.text ?: it.contentDescription)?.toString().equals(label, ignoreCase = true)
                      }
                      val found = exact ?: hits.firstOrNull()
                      if (found != null) return found
                  }
                  return null
              }

              private fun click(node: AccessibilityNodeInfo): Boolean {
                  var cur: AccessibilityNodeInfo? = node
                  while (cur != null) {
                      if (cur.isClickable && cur.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true
                      cur = cur.parent
                  }
                  val r = Rect()
                  node.getBoundsInScreen(r)
                  return tap(r.exactCenterX(), r.exactCenterY())
              }

              private fun scrollable(n: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  if (n.isScrollable) return n
                  for (i in 0 until n.childCount) {
                      val c = n.getChild(i) ?: continue
                      val s = scrollable(c)
                      if (s != null) return s
                  }
                  return null
              }

              private fun tapTopRight(): Boolean {
                  val d = resources.displayMetrics
                  return tap(d.widthPixels * 0.93f, d.heightPixels * 0.075f)
              }

              private fun tap(x: Float, y: Float): Boolean {
                  val p = Path()
                  p.moveTo(x, y)
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(p, 0, 60)).build()
                  return dispatchGesture(g, null, null)
              }
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ClearShares-apk
          path: app/build/outputs/apk/debug/app-debug.apk
